<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        /* Modern full-screen black canvas */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 110px 40px 40px 40px; /* Space at the top for fixed controls */
            background-color: #000000; /* Main background set to black */
            color: #f0f6fc; /* Light text color */
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Editable dynamic blocks */
        .user-block {
            outline: none;
            margin-top: 15px;
            margin-bottom: 15px;
            transition: background-color 0.2s;
            border-radius: 4px;
        }
        
        /* Subtle highlight visual guide only when editing mode is engaged */
        body.editing-active .user-block[contenteditable="true"]:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        body.editing-active .user-block[contenteditable="true"]:focus {
            background-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 2px #388bfd;
        }

        h1.user-block {
            color: #ffffff;
            font-weight: 700;
        }
        p.user-block {
            color: #8b949e;
        }

        .dynamic-img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #30363d;
            display: block;
        }

        /* Control Panel Styles */
        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            background: #161b22;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            border-right: 1px solid #30363d;
            padding-right: 15px;
        }
        .control-group:last-child {
            border-right: none;
        }
        .control-btn {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .control-btn:hover {
            background: #30363d;
            border-color: #8b949e;
        }
        .edit-btn-active {
            background-color: #388bfd !important;
            color: #ffffff !important;
            border-color: #58a6ff !important;
        }
        .save-btn {
            background-color: #238636;
            color: white;
            border: none;
        }
        .save-btn:hover {
            background-color: #2ea44f;
        }
        label {
            font-size: 0.85rem;
            color: #8b949e;
        }
        select, input[type="range"] {
            background: #21262d;
            color: #f0f6fc;
            border: 1px solid #30363d;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
        }
        #imageInput {
            display: none;
        }
        
        /* Content workspace canvas drop zone */
        #workspace {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            min-height: 300px;
        }
    </style>
</head>
<body class="editing-active">

    <!-- Configuration Action Bar -->
    <div class="controls" id="editorControls">
        <!-- Modes & Actions -->
        <div class="control-group">
            <button class="control-btn edit-btn-active" id="editToggleBtn" onclick="toggleEditMode()">✏️ Mode: Typing</button>
            <button class="control-btn" onclick="undoLastAction()">↩️ Undo</button>
        </div>

        <!-- Element Creation Blueprints -->
        <div class="control-group">
            <button class="control-btn" onclick="addBlankElement('h1')">+ Add Title Block</button>
            <button class="control-btn" onclick="addBlankElement('p')">+ Add Text Block</button>
            <button class="control-btn" onclick="triggerImageUpload()">+ Add JPEG</button>
            <input type="file" id="imageInput" accept="image/jpeg, image/jpg" onchange="previewImage(event)">
        </div>

        <!-- Font Configurations -->
        <div class="control-group">
            <label for="fontSelect">Font:</label>
            <select id="fontSelect">
                <option value="system-ui, sans-serif">Sans-Serif (Modern)</option>
                <option value="'Courier New', Courier, monospace">Monospace (Code Style)</option>
                <option value="Georgia, serif">Georgia (Classic)</option>
                <option value="'Comic Sans MS', cursive">Comic Sans (Casual)</option>
                <option value="'Impact', Charcoal, sans-serif">Impact (Bold Heading)</option>
            </select>
        </div>

        <!-- Size Configurations -->
        <div class="control-group">
            <label id="sizeLabel" for="sizeSlider">Size (24px):</label>
            <input type="range" id="sizeSlider" min="12" max="72" value="24" oninput="updateSizeLabel(this.value)">
        </div>

        <!-- Export Tool -->
        <div class="control-group">
            <button class="control-btn save-btn" onclick="downloadHTML()">💾 Save HTML File</button>
        </div>
    </div>

    <!-- Active Website Workspace -->
    <div id="workspace">
        <h1 class="user-block" contenteditable="true" style="font-family: system-ui, sans-serif; font-size: 40px;">Click here to edit this title...</h1>
        <p class="user-block" contenteditable="true" style="font-family: system-ui, sans-serif; font-size: 18px;">Click here to type your text content straight onto your website. Use the buttons above to drop additional blocks or adjust your active settings!</p>
    </div>

    <!-- Scripting Engine -->
    <script>
        const workspace = document.getElementById('workspace');
        const fontSelect = document.getElementById('fontSelect');
        const sizeSlider = document.getElementById('sizeSlider');
        const sizeLabel = document.getElementById('sizeLabel');
        const editToggleBtn = document.getElementById('editToggleBtn');
        
        let isEditing = true;

        function updateSizeLabel(val) {
            sizeLabel.textContent = `Size (${val}px):`;
        }

        function toggleEditMode() {
            isEditing = !isEditing;
            const blocks = document.querySelectorAll('.user-block');
            
            if (isEditing) {
                document.body.classList.add('editing-active');
                editToggleBtn.textContent = "✏️ Mode: Typing";
                editToggleBtn.classList.add('edit-btn-active');
                blocks.forEach(b => b.setAttribute('contenteditable', 'true'));
            } else {
                document.body.classList.remove('editing-active');
                editToggleBtn.textContent = "👁️ Mode: Preview";
                editToggleBtn.classList.remove('edit-btn-active');
                blocks.forEach(b => b.setAttribute('contenteditable', 'false'));
            }
        }

        function addBlankElement(tagType) {
            const font = fontSelect.value;
            const size = sizeSlider.value + 'px';
            const el = document.createElement(tagType);
            
            el.className = 'user-block';
            el.setAttribute('contenteditable', isEditing ? 'true' : 'false');
            el.style.fontFamily = font;
            el.style.fontSize = size;
            el.textContent = tagType === 'h1' ? 'New Title Layout Block...' : 'New editable text paragraph...';
            
            workspace.appendChild(el);
            if(isEditing) el.focus();
        }

        function triggerImageUpload() {
            document.getElementById('imageInput').click();
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'dynamic-img user-block';
                    workspace.appendChild(img);
                }
                reader.readAsDataURL(file);
            }
        }

        function undoLastAction() {
            const children = workspace.children;
            if (children.length > 0) {
                workspace.removeChild(children[children.length - 1]);
            }
        }

        function downloadHTML() {
            // Force turn off editing attributes and clean up containers before outputting code
            const blocks = document.querySelectorAll('.user-block');
            blocks.forEach(b => b.removeAttribute('contenteditable'));
            
            const controls = document.getElementById('editorControls');
            controls.remove();
            
            const scripts = document.querySelectorAll('script');
            scripts.forEach(s => s.remove());

            const pageContent = document.documentElement.outerHTML;
            const blob = new Blob([pageContent], { type: 'text/html' });
            const link = document.createElement('a');
            
            link.href = URL.createObjectURL(blob);
            link.download = 'index.html';
