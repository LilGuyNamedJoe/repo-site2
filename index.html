<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        /* Modern full-screen black canvas */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 100px 40px 40px 40px; /* Space at the top for fixed controls */
            background-color: #000000; /* Main background set to black */
            color: #f0f6fc; /* Light text color */
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Dynamic content styling */
        .user-title {
            color: #ffffff;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .user-text {
            color: #8b949e;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .dynamic-img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #30363d;
            display: block;
        }

        /* Control Panel Styles */
        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            background: #161b22;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            border-right: 1px solid #30363d;
            padding-right: 15px;
        }
        .control-group:last-child {
            border-right: none;
        }
        .control-btn {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
        }
        .control-btn:hover {
            background: #30363d;
            border-color: #8b949e;
        }
        .save-btn {
            background-color: #238636;
            color: white;
            border: none;
        }
        .save-btn:hover {
            background-color: #2ea44f;
        }
        label {
            font-size: 0.85rem;
            color: #8b949e;
        }
        select, input[type="range"] {
            background: #21262d;
            color: #f0f6fc;
            border: 1px solid #30363d;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
        }
        #imageInput {
            display: none;
        }
        
        /* Custom workspace container without the old look */
        #workspace {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <!-- Configuration Action Bar -->
    <div class="controls" id="editorControls">
        <!-- Element Creation -->
        <div class="control-group">
            <button class="control-btn" onclick="addElement('title')">+ Add Title</button>
            <button class="control-btn" onclick="addElement('text')">+ Add Text</button>
            <button class="control-btn" onclick="triggerImageUpload()">+ Add JPEG</button>
            <input type="file" id="imageInput" accept="image/jpeg, image/jpg" onchange="previewImage(event)">
        </div>

        <!-- Font Configurations -->
        <div class="control-group">
            <label for="fontSelect">Font:</label>
            <select id="fontSelect">
                <option value="system-ui, sans-serif">Sans-Serif (Modern)</option>
                <option value="'Courier New', Courier, monospace">Monospace (Code Style)</option>
                <option value="Georgia, serif">Georgia (Classic)</option>
                <option value="'Comic Sans MS', cursive">Comic Sans (Casual)</option>
                <option value="'Impact', Charcoal, sans-serif">Impact (Bold Heading)</option>
            </select>
        </div>

        <!-- Size Configurations -->
        <div class="control-group">
            <label id="sizeLabel" for="sizeSlider">Size (24px):</label>
            <input type="range" id="sizeSlider" min="12" max="72" value="24" oninput="updateSizeLabel(this.value)">
        </div>

        <!-- Export Tool -->
        <div class="control-group">
            <button class="control-btn save-btn" onclick="downloadHTML()">💾 Save HTML File</button>
        </div>
    </div>

    <!-- Active Website Workspace -->
    <div id="workspace">
        <!-- New elements will dump straight onto the black background here -->
    </div>

    <!-- Scripting Engine -->
    <script>
        const workspace = document.getElementById('workspace');
        const fontSelect = document.getElementById('fontSelect');
        const sizeSlider = document.getElementById('sizeSlider');
        const sizeLabel = document.getElementById('sizeLabel');

        function updateSizeLabel(val) {
            sizeLabel.textContent = `Size (${val}px):`;
        }

        function addElement(type) {
            const font = fontSelect.value;
            const size = sizeSlider.value + 'px';

            if (type === 'title') {
                const titleText = prompt("Enter heading text:");
                if (titleText) {
                    const h1 = document.createElement('h1');
                    h1.className = 'user-title';
                    h1.style.fontFamily = font;
                    h1.style.fontSize = size;
                    h1.textContent = titleText;
                    workspace.appendChild(h1);
                }
            } else if (type === 'text') {
                const bodyText = prompt("Enter body text:");
                if (bodyText) {
                    const p = document.createElement('p');
                    p.className = 'user-text';
                    p.style.fontFamily = font;
                    p.style.fontSize = size;
                    p.textContent = bodyText;
                    workspace.appendChild(p);
                }
            }
        }

        function triggerImageUpload() {
            document.getElementById('imageInput').click();
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'dynamic-img';
                    workspace.appendChild(img);
                }
                reader.readAsDataURL(file);
            }
        }

        function downloadHTML() {
            // Remove the editing dashboard layout before exporting code
            const controls = document.getElementById('editorControls');
            controls.remove();
            
            // Script tag removal so the exported file remains clean
            const scripts = document.querySelectorAll('script');
            scripts.forEach(s => s.remove());

            const pageContent = document.documentElement.outerHTML;
            const blob = new Blob([pageContent], { type: 'text/html' });
            const link = document.createElement('a');
            
            link.href = URL.createObjectURL(blob);
            link.download = 'index.html';
            link.click();
            
            // Reload page to bring dashboard framework back for editing
            location.reload();
        }
    </script>
</body>
</html>
