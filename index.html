<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joe's Website</title>
    <style>
        /* Sleek black dark theme styling */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            background-color: #000000; /* Main background set to black */
            color: #f0f6fc; /* Light text color */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #161b22; /* Dark gray container for contrast */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(255,255,255,0.05);
            text-align: center;
            border: 1px solid #30363d; /* Subtle border line */
            box-sizing: border-box;
        }
        h1 {
            color: #ffffff;
            margin-top: 0;
            font-size: 2.5rem;
        }
        h2 {
            color: #ffffff;
            margin-top: 25px;
            font-size: 1.8rem;
        }
        p {
            font-size: 1.1rem;
            color: #8b949e; /* Soft gray for description text */
        }
        .btn {
            display: inline-block;
            background-color: #238636; /* GitHub green color */
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 20px;
            transition: background 0.2s;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }
        .btn:hover {
            background-color: #2ea44f;
        }
        
        /* Added Content Styling */
        .dynamic-img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #30363d;
        }

        /* Top Right Control Panel */
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #21262d;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #30363d;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        .control-btn {
            background: #30363d;
            color: #c9d1d9;
            border: 1px solid #8b949e;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
        }
        .control-btn:hover {
            background: #8b949e;
            color: #000;
        }
        #imageInput {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Top Right Controls for Adding Content -->
    <div class="controls">
        <button class="control-btn" onclick="addTitle()">+ Add Title</button>
        <button class="control-btn" onclick="addText()">+ Add Text</button>
        <button class="control-btn" onclick="triggerImageUpload()">+ Add JPEG</button>
        <input type="file" id="imageInput" accept="image/jpeg, image/jpg" onchange="previewImage(event)">
    </div>

    <!-- Main Content Container -->
    <div class="container" id="mainContainer">
        <h1>Joe's Website 👋</h1>
        <p>My sites</p>
        
        <!-- Button linked directly to your science project -->
        <a href="https://github.io" class="btn">View Science Project</a>
    </div>

    <!-- Interactive JavaScript Engine -->
    <script>
        const container = document.getElementById('mainContainer');

        function addTitle() {
            const titleText = prompt("Enter your new title header:");
            if (titleText) {
                const h2 = document.createElement('h2');
                h2.textContent = titleText;
                container.appendChild(h2);
            }
        }

        function addText() {
            const bodyText = prompt("Enter your paragraph text:");
            if (bodyText) {
                const p = document.createElement('p');
                p.textContent = bodyText;
                container.appendChild(p);
            }
        }

        function triggerImageUpload() {
            document.getElementById('imageInput').click();
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'dynamic-img';
                    container.appendChild(img);
                }
                reader.readAsDataURL(file);
            }
        }
    </script>

</body>
</html>

</body>
</html>
